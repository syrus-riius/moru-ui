name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check generated artifacts and build
        run: npm run build

  registry:
    name: Registry consumer installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install generator dependencies
        run: npm ci
      - name: Check registry sources
        run: npm run registry:check
      - name: Install in a fresh consumer and build
        run: npm run registry:smoke -- --single
      - name: Install and build the downloadable project template
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'moru-project-check'
          with zipfile.ZipFile('public/downloads/moru-project-starter.zip') as archive:
              for item in archive.infolist():
                  destination = (target / item.filename).resolve()
                  if not destination.is_relative_to(target.resolve()):
                      raise RuntimeError('Unsafe starter archive path')
              archive.extractall(target)
          PY
          npm --prefix "$RUNNER_TEMP/moru-project-check/moru-project-starter" ci
          npm --prefix "$RUNNER_TEMP/moru-project-check/moru-project-starter" run build
